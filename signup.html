<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="MyEverylist">
	<title>MyEverylist</title>
	<link rel="stylesheet" href="main.css">


</head>
<body>


	<main class="login_main">
        <div class="login_image" >
            <a  href="index.html"><h3>MyEverylist - Prototype*</h3></a>

        </div>

        <div class="login">
            <h2>Welcome back</h2>
            <p>Sign in to pick up where you left off.</p>
            <form >
                <label for="username">Username</label>
                <input type="text" placeholder="OTA" name="username" required>

                <label for="email">Email Address</label>
                <input type="text" placeholder="example@ota.com" name="username" required>

                <label for="password">Password</label>
                <input type="password" placeholder="12345" name="password" required>

                <div class="login_options">
                    <div>
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Remember me</label>
                    </div>
                </div>

                <button class="btn_orange" type="submit">Sign In</button>
                <p>or</p>
                <div class="login_social">
                    <button class="btn_white">Sign in with Google</button>
                    <button class="btn_white">Sign in with GitHub</button>
                </div>

                
                <p><a href="login.html">Already have an account Sign in.</a></p>
            </form>
        </div>

	</main>
    
	<script src="main.js"></script>
</body>
</html>
